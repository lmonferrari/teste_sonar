name: SonarQube Analysis

on:
  pull_request:
    branches: ["master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonar:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: http://host.docker.internal:9000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_VERSION: 9.9.0.12345

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Cleanup SonarScanner Docker
        if: always()
        run: |
          echo "Removendo containers SonarScanner temporários..."
          docker ps -a --filter "ancestor=sonarsource/sonar-scanner-cli" --format "{{.ID}}" | xargs -r docker rm -f

          echo "Removendo imagens SonarScanner antigas..."
          docker images --filter "reference=b25df6" --format "{{.ID}}" | xargs -r docker rmi -f || true
